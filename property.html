<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Details — Haven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-row">
    <a href="index.html" class="brand">Haven<span>.</span></a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="listings.html">Listings</a></li>
        <li><a href="property.html" class="active">Property Details</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="details-section">
  <div class="wrap">

    <p class="breadcrumb"><a href="listings.html">Listings</a> &nbsp;/&nbsp; <span id="crumb-name"></span></p>

    <div class="details-layout">

      <div class="gallery-col">
        <div class="gallery-main">
          <img id="main-image" alt="">
        </div>
        <div class="gallery-thumbs" id="thumbs"></div>

        <div class="details-main">
          <div class="heading-row">
            <h1 id="prop-title"></h1>
            <span class="price-tag" id="prop-price"></span>
          </div>
          <p class="location-line" id="prop-location"></p>

          <div class="spec-strip" id="spec-strip"></div>

          <h2 class="section-title">Description</h2>
          <p class="description" id="prop-description"></p>

          <h2 class="section-title">Amenities</h2>
          <ul class="amenities-list" id="amenities"></ul>
        </div>
      </div>

      <aside>
        <div class="contact-card">
          <h3>Contact the Owner</h3>
          <p class="agent-name" id="agent-name"></p>

          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Enter your name">

          <label for="phone">Phone Number</label>
          <input type="text" id="phone" placeholder="Enter your 10-digit phone number">

          <label for="message">Message</label>
          <textarea id="message"></textarea>

          <p class="form-msg" id="form-msg"></p>
          <button type="button" class="btn-primary" id="send-btn">Send Inquiry</button>
        </div>
      </aside>

    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-row">
      <span class="brand">Haven<span>.</span></span>
      <ul class="footer-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="listings.html">Listings</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
    <p class="footer-note">Real Estate Property Management Platform — Mini Project, GLA University.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/property.js"></script>

</body>
</html>
